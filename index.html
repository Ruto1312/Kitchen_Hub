<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KitchenHub Myanmar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#top"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 11h16v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6Z M2 11h20 M9 7c0-1.5 1-2 1-3.5 M14 7c0-1.5 1-2 1-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>KitchenHub</a>
    <nav><a href="#products" data-i="nav.shop">Shop</a><a href="#why" data-i="nav.why">Why us</a><a href="#brands" data-i="nav.brands">Brands</a><a href="#faq" data-i="nav.faq">FAQ</a><a href="#join" class="navjoin" data-i="nav.join">Join waitlist</a></nav>
    <div class="lang" role="group" aria-label="Language / ဘာသာစကား">
      <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="my" aria-pressed="false" lang="my">မြန်မာ</button>
    </div>
    <button class="cartbtn" id="openCart" data-i-aria="cart.open"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.3" fill="currentColor"/><circle cx="17" cy="20" r="1.3" fill="currentColor"/></svg><span class="cartlabel" data-i="cart">Cart</span><span id="count">0</span></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-text">
        <p class="eyebrow" data-i="hero.eyebrow"></p>
        <h1 data-i="hero.title"></h1>
        <p class="lead" data-i="hero.lead"></p>
        <div class="hero-cta"><a class="btn" href="#products"><span data-i="hero.shop"></span><span aria-hidden="true">→</span></a><a class="btn ghost" href="#join" data-i="hero.join"></a></div>
        <ul class="perks">
          <li data-i="perk.1"></li>
          <li data-i="perk.2"></li>
          <li data-i="perk.3"></li>
        </ul>
      </div>
      <div class="hero-visual">
        <div class="hero-blob" aria-hidden="true"></div>
        <div class="hero-pic"><img src="images/hero.jpg" alt=""></div>
        <div class="float f1"><span class="fdot" aria-hidden="true">✦</span><span id="hero-stat"></span></div>
        <div class="float f2"><span class="fdot green" aria-hidden="true">✓</span><span data-i="hero.pay"></span></div>
      </div>
    </div>
  </section>

  <section class="how" aria-labelledby="how-title">
    <div class="wrap">
      <div class="steps">
        <div class="step"><span class="snum">1</span><div><h3 data-i="how.1.t"></h3><p data-i="how.1.d"></p></div></div>
        <div class="step"><span class="snum">2</span><div><h3 data-i="how.2.t"></h3><p data-i="how.2.d"></p></div></div>
        <div class="step"><span class="snum">3</span><div><h3 data-i="how.3.t"></h3><p data-i="how.3.d"></p></div></div>
      </div>
      <h2 id="how-title" class="sr-only" data-i="how.title"></h2>
    </div>
  </section>



  <section id="products">
    <div class="wrap">
      <div class="shop-head">
        <div><p class="eyebrow" data-i="shop.eyebrow"></p><h2 data-i="shop.title"></h2></div>
        <label class="search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" data-i-ph="search.ph" data-i-aria="search.ph"></label>
      </div>
      <div class="chips" id="chips" data-i-aria="chips.aria"></div>
      <div class="grid" id="category-grid"></div>
      <p id="none" data-i="none"></p>
    </div>
  </section>


  <section id="why" class="why">
    <div class="wrap">
      <div class="why-head"><p class="eyebrow" data-i="why.eyebrow"></p><h2 data-i="why.title"></h2></div>
      <div class="benefits" id="benefits"></div>
      <figure class="why-quote"><blockquote data-i="why.quote"></blockquote><figcaption data-i="why.quote.by"></figcaption></figure>
    </div>
  </section>

  <section class="poll-wrap" aria-labelledby="poll-title">
    <div class="wrap">
      <div class="poll" id="poll">
        <div class="poll-text"><p class="eyebrow" data-i="poll.eyebrow"></p><h3 id="poll-title" data-i="poll.q"></h3></div>
        <div class="poll-opts" id="poll-opts"></div>
        <p class="poll-thanks" id="poll-thanks" role="status" hidden data-i="poll.thanks"></p>
      </div>
    </div>
  </section>

  <section id="brands">
    <div class="wrap">
      <p class="eyebrow center" data-i="brands.eyebrow"></p>
      <h2 data-i="brands.title"></h2>
      <p class="sub" data-i="brands.sub"></p>
      <div class="brands">
        <div class="bcol"><h3><span class="flag" aria-hidden="true">VN</span><span data-i="brands.vn"></span></h3><ul>
          <li><b>Sunhouse</b><span data-i="b.sunhouse"></span></li>
          <li><b>Kangaroo</b><span data-i="b.kangaroo"></span></li>
          <li><b>Goldsun</b><span data-i="b.goldsun"></span></li>
          <li><b>Bluestone</b><span data-i="b.bluestone"></span></li></ul></div>
        <div class="bcol"><h3><span class="flag" aria-hidden="true">MM</span><span data-i="brands.mm"></span></h3><ul>
          <li><b>Swan Arr Electronic</b><span data-i="b.swanarr"></span></li>
          <li><b>Nibban Electric &amp; Electronics</b><span data-i="b.nibban"></span></li>
          <li><b>Panasonic</b><span data-i="b.panasonic"></span></li>
          <li><b>Tefal, Krups, Supor, PowerPac, Prato</b><span data-i="b.imported"></span></li></ul></div>
      </div>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap mission">
      <div class="mcard light"><p class="eyebrow" data-i="mission.eyebrow"></p><p class="mbig" data-i="mission.text"></p></div>
      <div class="mcard dark"><p class="eyebrow" data-i="vision.eyebrow"></p><p class="mbig" data-i="vision.text"></p></div>
    </div>
  </section>

  <section id="faq">
    <div class="wrap faq">
      <h2 data-i="faq.title"></h2>
      <p class="sub" data-i="faq.sub"></p>
      <details><summary data-i="faq.1.q"></summary><p data-i="faq.1.a"></p></details>
      <details><summary data-i="faq.2.q"></summary><p data-i="faq.2.a"></p></details>
      <details><summary data-i="faq.3.q"></summary><p data-i="faq.3.a"></p></details>
      <details><summary data-i="faq.4.q"></summary><p data-i="faq.4.a"></p></details>
      <details><summary data-i="faq.5.q"></summary><p data-i="faq.5.a"></p></details>
    </div>
  </section>

  <section id="join" class="join">
    <div class="wrap join-grid">
      <div class="join-text">
        <p class="eyebrow" data-i="join.eyebrow"></p>
        <h2 data-i="join.title"></h2>
        <p class="lead" data-i="join.lead"></p>
        <ul class="join-points"><li data-i="join.p1"></li><li data-i="join.p2"></li><li data-i="join.p3"></li></ul>
      </div>
      <form id="wl" class="join-form" novalidate>
        <label><span data-i="f.name"></span><input name="name" required maxlength="80" autocomplete="name"></label>
        <label><span data-i="f.phone"></span><input name="phone" required maxlength="40" type="tel" autocomplete="tel" data-i-ph="f.phone.ph"></label>
        <div class="two">
          <label><span data-i="f.city"></span><select name="city" required class="city-select"></select></label>
          <label><span data-i="f.want"></span><select name="want" class="want-select"></select></label>
        </div>
        <label class="consent"><input type="checkbox" name="consent" required><span data-i="f.consent"></span></label>
        <button class="btn full" type="submit" data-i="join.btn"></button>
        <p class="form-err" role="alert" hidden data-i="f.err"></p>
        <div class="join-ok" role="status" hidden><span class="done-check" aria-hidden="true">✓</span><div><b data-i="join.ok.t"></b><p data-i="join.ok.d"></p></div></div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <div><a class="logo light" href="#top"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 11h16v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6Z M2 11h20 M9 7c0-1.5 1-2 1-3.5 M14 7c0-1.5 1-2 1-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>KitchenHub</a><p data-i="footer.tag"></p></div>
    <nav class="fnav"><a href="#products" data-i="nav.shop"></a><a href="#why" data-i="nav.why"></a><a href="#brands" data-i="nav.brands"></a><a href="#faq" data-i="nav.faq"></a><a href="#join" data-i="nav.join"></a></nav>
  </div>
  <div class="wrap copy"><span data-i="footer.copy"></span><span class="privacy" data-i="footer.privacy"></span></div>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Product details"><div class="mbox" id="mbox"></div></div>
<div id="overlay"></div>
<aside id="drawer" aria-label="Shopping cart">
  <div class="dhead"><h2 id="dtitle"></h2><button class="x" id="closeCart" data-i-aria="d.close">×</button></div>
  <div id="vCart" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="dbody" id="items"></div>
    <div class="dfoot" id="cfoot">
      <div class="total"><span data-i="d.total"></span><span id="total">$0.00</span></div>
      <button class="btn full" id="toCheckout" data-i="d.checkout"></button>
    </div>
  </div>
  <div id="vCheckout" style="display:none;flex-direction:column;flex:1;min-height:0">
    <form class="dbody" id="co" novalidate>
      <p class="co-intro" data-i="co.intro"></p>
      <label><span data-i="f.name"></span><input name="name" required maxlength="80" autocomplete="name"></label>
      <label><span data-i="f.phone"></span><input name="phone" type="tel" required maxlength="40" autocomplete="tel" data-i-ph="f.phone.ph"></label>
      <label><span data-i="f.city"></span><select name="city" required class="city-select"></select></label>
      <label class="consent"><input type="checkbox" name="consent" required><span data-i="f.consent"></span></label>
      <div class="total"><span data-i="d.total"></span><span id="total2">$0.00</span></div>
      <button class="btn full" type="submit" data-i="co.place"></button>
      <p class="form-err" role="alert" hidden data-i="f.err"></p>
      <button class="btn outline full" type="button" id="back" data-i="co.back"></button>
      <p class="note" data-i="co.note"></p>
    </form>
  </div>
  <div id="vDone" class="dbody" style="display:none;text-align:center">
    <div class="done-check" aria-hidden="true">✓</div>
    <h2 data-i="done.title"></h2>
    <p><span data-i="done.text"></span> <b id="ordno"></b>.</p>
    <button class="btn full" id="keep" data-i="done.keep"></button>
  </div>
</aside>

<script src="js/products.js"></script>
<script src="js/i18n.js"></script>
<script src="js/tracking.js"></script>
<script src="js/signup.js"></script>
<script src="js/app.js"></script>
</body>
</html>
